# Ambiente completo para desenvolvimento e homologação:
#   cp .env.example .env && docker compose up --build
# Web: http://localhost:3000 · API: http://localhost:3001/api · BI (Metabase): http://localhost:3002
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sisevent
      POSTGRES_USER: sisevent_owner          # dono do schema: roda as migrações
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-owner_dev}
      TZ: America/Sao_Paulo
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisevent_owner -d sisevent"]
      interval: 3s
      retries: 20

  # Aplica migrações + seed de demonstração e cria o usuário da API (sujeito ao RLS)
  migracoes:
    build: { context: ./apps/api, target: migracoes }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL_OWNER: postgres://sisevent_owner:${DB_OWNER_PASSWORD:-owner_dev}@db:5432/sisevent
      API_DB_USER: sisevent_api
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api_dev}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:-metabase_dev}
      CARREGAR_SEED: ${CARREGAR_SEED:-1}

  api:
    build: { context: ./apps/api, target: producao }
    depends_on: { migracoes: { condition: service_completed_successfully } }
    environment:
      DATABASE_URL: postgres://sisevent_api:${API_DB_PASSWORD:-api_dev}@db:5432/sisevent
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      DADOS_CHAVE: ${DADOS_CHAVE:?defina DADOS_CHAVE no .env (gere com npm run gerar-chave em apps/api)}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${APP_URL:-http://localhost:3000}
      METABASE_URL: ${METABASE_PUBLIC_URL:-http://localhost:3002}
      METABASE_EMBED_SECRET: ${METABASE_EMBED_SECRET:-}
      BI_REFRESH_MINUTES: ${BI_REFRESH_MINUTES:-60}
      MASTER_EMAIL: ${MASTER_EMAIL:-}
      MASTER_NOME: ${MASTER_NOME:-Manutenção}
      MASTER_SENHA_HASH: ${MASTER_SENHA_HASH:-}
      NODE_ENV: production
    ports: ["3001:3001"]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on: [api]
    ports: ["3000:3000"]

  # BI: lê somente o schema "analytics" com um usuário somente leitura
  metabase:
    image: metabase/metabase:latest
    depends_on: { migracoes: { condition: service_completed_successfully } }
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_EMBEDDING_SECRET_KEY: ${METABASE_EMBED_SECRET:-}
      JAVA_TIMEZONE: America/Sao_Paulo
    ports: ["3002:3000"]
    volumes: [metabasedata:/metabase-data]

volumes:
  dbdata:
  metabasedata:
